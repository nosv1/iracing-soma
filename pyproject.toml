[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Spoken race engineer for iRacing"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "piper-tts>=1.8.0",
    "pyirsdk>=1.3.7",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[[tool.mypy.overrides]]
# these ship no type info (no stubs, no py.typed); treat their imports as Any
module = ["irsdk", "sounddevice"]
ignore_missing_imports = true

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (default); I: import sorting; N: PEP 8 naming;
# UP: modern syntax for the target Python; B: common bug patterns
select = ["E", "F", "I", "N", "UP", "B"]
