[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Spoken race engineer for iRacing"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "piper-tts>=1.8.0",
    "pyirsdk>=1.3.7",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

# The coding standard: nosv1/nosv1 CODING.md (standard/mypy.ini, standard/ruff.toml). Strictest settings;
# today's findings are in checks-baseline.json, which only shrinks (tools/check_baseline.py).
[tool.mypy]
files = ["main.py", "src", "tests"]
strict = true
warn_unreachable = true
extra_checks = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool", "truthy-iterable", "ignore-without-code", "unused-awaitable", "redundant-self"]
[[tool.mypy.overrides]]
# these ship no type info (no stubs, no py.typed); treat their imports as Any
module = ["irsdk", "sounddevice"]
ignore_missing_imports = true

[tool.pyright]
# Pylance reads this too: check against 3.14 (PEP 649 deferred annotations, so a
# class can name itself in its own hints) regardless of the editor's interpreter pick
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Each family is here for a rule in CODING.md; style-only families (docstrings, quotes, commas) are taste.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "C90", "S", "ANN", "ARG", "RET", "SIM", "TRY", "PERF", "PL", "PT", "RUF", "ERA", "PGH", "ISC", "PIE", "SLF", "EM", "DTZ", "TID", "TC"]
# PLR2004 magic numbers, TRY003/EM long messages: taste. PT009/PT027: unittest asserts are allowed.
ignore = ["PLR2004", "TRY003", "EM101", "EM102", "E501", "PT009", "PT027"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-statements = 50
max-branches = 12
max-returns = 6
max-nested-blocks = 4

[tool.ruff.lint.pep8-naming]
# keep the brand's capitalization in names (class iRacing, queue_iRacing_frame)
extend-ignore-names = ["*iRacing*"]
