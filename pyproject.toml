[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Spoken race engineer for iRacing"
requires-python = ">=3.14"
dependencies = [
    "piper-tts==1.8.0",
    "pyirsdk==1.3.7",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (default); I: import sorting; N: PEP 8 naming;
# UP: modern syntax for the target Python; B: common bug patterns
select = ["E", "F", "I", "N", "UP", "B"]
